# molt.toml — Stack manifest for __MOLT_HOSTNAME__
# Personal config repo: __MOLT_GITHUB__/molt-__MOLT_USER__

[stack]
name = "molt-__MOLT_USER__"
version = "0.1.0"
user_repo = "Molt-__MOLT_USER__"

[sleeve]
hostname = "__MOLT_HOSTNAME__"
instance_dir = "instances/__MOLT_HOSTNAME__"
projects_dir = "~/Devel/prj"

# Liberators run in the order listed here. Enabled out of the box: the
# liberators that need no extra config beyond what this skeleton ships. Enable
# the rest as you add config/<name>/.

[[liberator]]
name = "system"
enabled = true
os = ["linux", "macos"]

[[liberator]]
name = "local-bin"
enabled = true
os = ["linux", "macos"]

[[liberator]]
name = "git"
enabled = true
os = ["linux", "macos"]

[[liberator]]
name = "ssh"
enabled = true
os = ["linux", "macos"]

# --- Enable as you add the matching config/ directories ---

[[liberator]]
name = "zsh"
enabled = false
os = ["linux", "macos"]

[[liberator]]
name = "tmux"
enabled = false
os = ["linux", "macos"]

[[liberator]]
name = "editors"
enabled = false
os = ["linux", "macos"]

[[liberator]]
name = "iterm2"
enabled = false
os = ["macos"]

[[liberator]]
name = "vscode"
enabled = false
os = ["linux", "macos"]

[[liberator]]
name = "dev-tools"
enabled = false
os = ["linux", "macos"]

# Needs no config/ directory, so it is enabled; it stays here for its place
# in the run order.
[[liberator]]
name = "npm"
enabled = true
os = ["linux", "macos"]

[[liberator]]
name = "brew"
enabled = false
os = ["macos"]

# Needs no config/ directory, so it is enabled; it stays here for its place
# in the run order.
[[liberator]]
name = "claude"
enabled = true
os = ["linux", "macos"]

# The published environment: CLAUDE_CONFIG_DIR, each <TOOL>_INSTALL_PREFIX
# vars.sh exports, and a login shell's PATH for GUI apps. After claude, which
# hands over CLAUDE_CONFIG_DIR only once its state has moved. Off until vars.sh
# declares MOLT_CLAUDE_CONFIG_DIR or a prefix, and zshrc puts ~/.local/bin
# first on PATH; the claude check names this entry when a config dir is
# declared and it is still off.
[[liberator]]
name = "env"
enabled = false
os = ["linux", "macos"]
