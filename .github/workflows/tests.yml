name: Molt Tests

on:
  push:
    branches: [ main ]
    # ONE TAG FILTER FOR THE WHOLE FLEET, carrying both release forms (hv,
    # 2026-09-22): Molt tags v0.1.1, and Utilz has tagged bare since 2.7.0.
    # This is the only place in this file where a tag's FORM is written.
    tags: ['v[0-9]*', '[0-9]*']
    # A push that only moves a board starts no run (devbin#0110). Path filters
    # are not evaluated for pushes of tags, so this cannot suppress a release.
    paths-ignore:
      - 'intent/whiteboard/**'
      # BOTH PATHS OR NEITHER (devbin#0110): GitHub skips a push only when EVERY
      # changed path matches, and `intent wb` writes a canon event beside the
      # board view it renders -- so the whiteboard line ALONE suppresses nothing
      # a node actually does. Justified by what no job READS, not by a hit rate:
      # no job here opens either tree, and that stays true as habits change.
      - 'intent/.canon/**'
  pull_request:
    branches: [ main ]
  # ON DEMAND. The macOS leg no longer runs on a push (devbin#0108), so this is
  # how it is asked for between releases:
  #
  #   gh workflow run tests.yml --ref main
  workflow_dispatch:

# SUPERSEDED RUNS ARE CANCELLED (hv's ruling of 2026-09-21; devbin#0108 carries
# the reasoning). The EVENT is part of the key because a push to main and a
# workflow_dispatch on main share a ref: a group keyed on the ref alone would
# let a push cancel an on-demand macOS run after its ten-times minutes had been
# spent, and let a dispatch cancel a push's run. A tag has its own ref, so a
# release run is never cancelled by a push.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-linux:
    name: Test on Ubuntu
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Install bats-core
      run: |
        wget https://github.com/bats-core/bats-core/archive/v1.12.0.tar.gz
        tar -xzf v1.12.0.tar.gz
        cd bats-core-1.12.0
        sudo ./install.sh /usr/local
        echo "PATH=/usr/local/bin:$PATH" >> "$GITHUB_ENV"
        bats --version

    - name: Configure git identity for tests
      run: |
        git config --global user.email "ci@test.local"
        git config --global user.name "CI"

    - name: Make scripts executable
      run: |
        chmod +x bin/*
        chmod +x liberators/*.sh

    - name: Run tests
      run: |
        bats test/*.bats test/liberators/*.bats

  test-macos:
    name: Test on macOS
    # ON TAGS AND ON DEMAND, NEVER ON A PUSH (hv's ruling of 2026-09-21,
    # devbin#0108). A macOS minute costs ten times a Linux one on a private
    # repository, and the fleet applies one rule rather than one per repository.
    #
    # The tag half asks github.ref_type, which GitHub documents as `branch` or
    # `tag`, and never the tag's spelling: on.push.tags above decides WHICH tags
    # start a run, and this decides whether the run carries macOS. A
    # pull_request's ref is refs/pull/N/merge, whose ref_type is `branch`, so
    # the leg skips there too -- deliberately, and Test Summary below knows it.
    if: ${{ github.ref_type == 'tag' || github.event_name == 'workflow_dispatch' }}
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Install bats-core
      run: |
        brew install bats-core
        echo "PATH=$PATH:/usr/local/bin:/opt/homebrew/bin" >> "$GITHUB_ENV"
        bats --version

    - name: Configure git identity for tests
      run: |
        git config --global user.email "ci@test.local"
        git config --global user.name "CI"

    - name: Make scripts executable
      run: |
        chmod +x bin/*
        chmod +x liberators/*.sh

    - name: Run tests
      run: |
        bats test/*.bats test/liberators/*.bats

  shellcheck:
    name: Shell Script Analysis
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Run ShellCheck
      run: |
        echo "Running ShellCheck on Molt scripts..."
        shellcheck -x bin/molt
        for script in lib/*.sh; do
          shellcheck -x "$script"
        done
        for script in liberators/*.sh; do
          shellcheck -x "$script"
        done
        echo "ShellCheck: all clean"

  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [test-linux, test-macos]
    # NOT always(). Cancelling superseded runs (see concurrency above) makes a
    # cancelled run an ordinary event rather than a rare one, and always() would
    # print a failure into the log of every push that overtook another. A
    # verdict that is red in ordinary operation is one people stop reading.
    # cancelled() asks about the RUN, so a failed or cancelled LEG inside a live
    # run still reaches the decision below and is still reported.
    if: ${{ !cancelled() }}

    # THE INPUTS COME THROUGH env RATHER THAN INLINE ${{ }}, so the script below
    # is a script: it can be run on a given combination of results, by a person
    # or by a test. An inline expression can only ever be read.
    env:
      LINUX: ${{ needs.test-linux.result }}
      MACOS: ${{ needs.test-macos.result }}
      MACOS_REQUIRED: ${{ github.ref_type == 'tag' || github.event_name == 'workflow_dispatch' }}

    steps:
    - name: Summary
      run: |
        echo "## Test Summary"
        echo "test-linux     = '$LINUX'"
        echo "test-macos     = '$MACOS'"
        echo "macos required = '$MACOS_REQUIRED'"
        failed=""
        [ "$LINUX" = success ] || failed="$failed test-linux"
        # A SKIPPED macOS LEG IS A PASS ONLY WHERE IT WAS NOT ASKED FOR. On a
        # release tag or an on-demand run it is a missing verdict wearing a
        # pass. An EMPTY result -- a job GitHub never started, which is what a
        # billing refusal looks like from here -- is never acceptable, on any
        # event. Before this, the summary required macOS to have SUCCEEDED on
        # every event, so gating the leg without rewriting this would have
        # turned every push red.
        if [ "$MACOS_REQUIRED" = true ]; then
          [ "$MACOS" = success ] || failed="$failed test-macos"
        else
          case "$MACOS" in
            success | skipped) ;;
            *) failed="$failed test-macos" ;;
          esac
        fi
        if [ -n "$failed" ]; then
          printf 'FAILED:%s\n' "$failed"
          exit 1
        fi
        echo "All required checks passed."
