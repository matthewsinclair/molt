name: Molt Tests

on:
  push:
    # main, and a release candidate: devbin's release core pushes the release
    # commit to candidate/<tag> before it tags, and reads this workflow's run
    # there as the CI verdict, the macOS leg included (issue 0087).
    branches: [ main, 'candidate/**' ]
    # NO TAG STARTS A RUN (issue 0089): a cut tags only once the candidate's
    # run is green, so a run on the tag would repeat that verdict, and nothing
    # reads it. pplr's workflow has no tag trigger either.
    #
    # A push that only moves a board starts no run (devbin#0110). A
    # candidate's push is filtered too, but its release commit always changes
    # VERSION and CHANGELOG.md, and the cut's pre-flight asks
    # `bin/devbin ci-state --fires` whether that push starts a run.
    paths-ignore:
      - 'intent/whiteboard/**'
      # BOTH PATHS OR NEITHER (devbin#0110): GitHub skips a push only when EVERY
      # changed path matches, and `intent wb` writes a canon event beside the
      # board view it renders -- so the whiteboard line ALONE suppresses nothing
      # a node actually does. Justified by what no job READS, not by a hit rate:
      # no job here opens either tree, and that stays true as habits change.
      - 'intent/.canon/**'
  pull_request:
    branches: [ main ]
  # ON DEMAND. The macOS leg runs on no push but a candidate's (devbin#0108),
  # so this is how it is asked for between releases:
  #
  #   gh workflow run tests.yml --ref main
  workflow_dispatch:

# SUPERSEDED RUNS ARE CANCELLED (hv's ruling of 2026-09-21; devbin#0108 carries
# the reasoning). The EVENT is part of the key because a push to main and a
# workflow_dispatch on main share a ref: a group keyed on the ref alone would
# let a push cancel an on-demand macOS run after its ten-times minutes had been
# spent, and let a dispatch cancel a push's run. A candidate has its own ref,
# so a release's run is never cancelled by a push to main.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-linux:
    name: Test on Ubuntu
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Install bats-core
      run: |
        wget https://github.com/bats-core/bats-core/archive/v1.12.0.tar.gz
        tar -xzf v1.12.0.tar.gz
        cd bats-core-1.12.0
        sudo ./install.sh /usr/local
        echo "PATH=/usr/local/bin:$PATH" >> "$GITHUB_ENV"
        bats --version

    # zsh.bats runs zsh_check and zsh_verify against a real zsh wherever there
    # is one (require_command). macOS carries zsh; the Ubuntu image does not.
    - name: Install zsh
      run: sudo apt-get install -y zsh

    - name: Make scripts executable
      run: |
        chmod +x bin/*
        chmod +x liberators/*.sh

    - name: Run tests
      run: |
        bats test/*.bats test/liberators/*.bats

  test-macos:
    name: Test on macOS
    # ON CANDIDATES AND ON DEMAND, NEVER ON A PUSH TO MAIN (hv's ruling of
    # 2026-09-21, devbin#0108). A macOS minute costs ten times a Linux one on a
    # private repository, and the fleet applies one rule rather than one per
    # repository. A candidate, candidate/<tag>, is the release commit devbin's
    # release core pushes before it tags, and its run is the verdict the cut
    # reads, so it carries this /bin/bash 3.2 leg (issue 0087). No tag starts
    # a run (issue 0089).
    #
    # A pull_request's ref is refs/pull/N/merge, so the leg skips there too,
    # deliberately, and Test Summary below knows it. Test Summary's
    # MACOS_REQUIRED names the same two cases.
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/heads/candidate/') }}
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Install bats-core
      run: |
        brew install bats-core
        echo "PATH=$PATH:/usr/local/bin:/opt/homebrew/bin" >> "$GITHUB_ENV"
        bats --version

    - name: Make scripts executable
      run: |
        chmod +x bin/*
        chmod +x liberators/*.sh

    - name: Run tests
      run: |
        bats test/*.bats test/liberators/*.bats

  shellcheck:
    name: Shell Script Analysis
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Run ShellCheck
      run: |
        echo "Running ShellCheck on Molt scripts..."
        shellcheck -x bin/molt
        for script in lib/*.sh; do
          shellcheck -x "$script"
        done
        for script in liberators/*.sh; do
          shellcheck -x "$script"
        done
        echo "ShellCheck: all clean"

  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [test-linux, test-macos]
    # NOT always(). Cancelling superseded runs (see concurrency above) makes a
    # cancelled run an ordinary event rather than a rare one, and always() would
    # print a failure into the log of every push that overtook another. A
    # verdict that is red in ordinary operation is one people stop reading.
    # cancelled() asks about the RUN, so a failed or cancelled LEG inside a live
    # run still reaches the decision below and is still reported.
    if: ${{ !cancelled() }}

    # THE INPUTS COME THROUGH env RATHER THAN INLINE ${{ }}, so the script below
    # is a script: it can be run on a given combination of results, by a person
    # or by a test. An inline expression can only ever be read.
    env:
      LINUX: ${{ needs.test-linux.result }}
      MACOS: ${{ needs.test-macos.result }}
      MACOS_REQUIRED: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/heads/candidate/') }}

    steps:
    - name: Summary
      run: |
        echo "## Test Summary"
        echo "test-linux     = '$LINUX'"
        echo "test-macos     = '$MACOS'"
        echo "macos required = '$MACOS_REQUIRED'"
        failed=""
        [ "$LINUX" = success ] || failed="$failed test-linux"
        # A SKIPPED macOS LEG IS A PASS ONLY WHERE IT WAS NOT ASKED FOR. On a
        # candidate or an on-demand run it is a missing verdict wearing a pass. An EMPTY result -- a job GitHub never started, which is what a
        # billing refusal looks like from here -- is never acceptable, on any
        # event. Before this, the summary required macOS to have SUCCEEDED on
        # every event, so gating the leg without rewriting this would have
        # turned every push red.
        if [ "$MACOS_REQUIRED" = true ]; then
          [ "$MACOS" = success ] || failed="$failed test-macos"
        else
          case "$MACOS" in
            success | skipped) ;;
            *) failed="$failed test-macos" ;;
          esac
        fi
        if [ -n "$failed" ]; then
          printf 'FAILED:%s\n' "$failed"
          exit 1
        fi
        echo "All required checks passed."
